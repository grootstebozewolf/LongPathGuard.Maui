name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    name: Build, Test & Pack
    # Tests assert RuntimeInformation.IsOSPlatform(Windows) — must run on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test (BDD specs)
        run: >
          dotnet test spec/LongPathGuard.Maui.Specs/LongPathGuard.Maui.Specs.csproj
          --no-build -c Release
          --logger "trx;LogFileName=results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx

      - name: Pack
        run: >
          dotnet pack src/LongPathGuard.Maui/LongPathGuard.Maui.csproj
          --no-build -c Release -o ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  publish:
    name: Publish to NuGet.org
    runs-on: windows-latest
    needs: ci
    # Only runs when a version tag is pushed, e.g. git tag v1.0.0 && git push --tags
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

  publish-github:
    name: Publish to GitHub Packages
    runs-on: windows-latest
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      packages: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: ./artifacts

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Add GitHub Packages source
        run: >
          dotnet nuget add source
          --username grootstebozewolf
          --password ${{ secrets.GITHUB_TOKEN }}
          --store-password-in-clear-text
          --name github
          "https://nuget.pkg.github.com/grootstebozewolf/index.json"

      - name: Push to GitHub Packages
        run: dotnet nuget push ./artifacts/*.nupkg --source "github"
